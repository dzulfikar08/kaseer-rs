[package]
name = "kaseer-core"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
