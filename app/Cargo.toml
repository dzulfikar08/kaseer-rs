[package]
name = "kaseer"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Kaseer: offline-first point-of-sale terminal"

[dependencies]
gpui-kit = "0.9"
kaseer-core = { path = "../core" }
serde_json = "1"
# Cloud sync transport: rustls (no OpenSSL), JSON responses via bytes.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Auto-update integrity: verify the downloaded release against the
# manifest's sha256 before it can replace the running binary.
sha2 = "0.10"

[build-dependencies]
# Windows: embeds the app icon in kaseer.exe (build.rs).
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"
