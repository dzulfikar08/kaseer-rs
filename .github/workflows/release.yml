# Versioned releases. Push a tag `vX.Y.Z` that matches [workspace.package] version in
# Cargo.toml and has a `## [X.Y.Z]` section in CHANGELOG.md:
#   git tag -a v0.3.0 -m "Kaseer 0.3.0" && git push origin v0.3.0
# The GitHub Release (notes = that CHANGELOG section) gets:
#   Kaseer-X.Y.Z-{x86_64,aarch64}.AppImage, kaseer-X.Y.Z-{x86_64,aarch64}-linux.tar.gz   Linux
#   Kaseer-X.Y.Z.dmg, kaseer-X.Y.Z-universal-macos.tar.gz                              macOS (Developer ID, notarised)
#   Kaseer-Setup-X.Y.Z-x64.exe, Kaseer-X.Y.Z-x64.zip                                   Windows (unsigned)
#   kaseer-X.Y.Z-{x86_64,aarch64}-linux, kaseer-X.Y.Z-x86_64-windows.exe   raw binaries that
#     kaseer-cloud (RELEASES_REPO) hands enrolled terminals as their auto-update
#   Kaseer.dmg, Kaseer-Setup-x64.exe, Kaseer-x64.zip, Kaseer-{x86_64,aarch64}.AppImage   the same
#     files under fixed names, for releases/latest/download/<name> links (kaseer.site)
#   SHA256SUMS
#
# Dry run (builds every package, uploads workflow artifacts only, no release):
#   gh workflow run release.yml --ref main
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build every package, but upload workflow artifacts only (no GitHub Release)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check tag, version, changelog
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version (and tag) match Cargo.toml
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[workspace.package\]/{s=1;next} /^\[/{s=0} s && /^version *=/{gsub(/.*= *"|".*/,""); print; exit}' Cargo.toml)"
          [ -n "$cargo_version" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          publish=true
          if [ "$DRY_RUN" = true ]; then
            publish=false
          elif [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::publishing needs a v* tag ref (got ${GITHUB_REF}); use dry_run=true from a branch"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v${cargo_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${cargo_version} (expected v${cargo_version})"
            exit 1
          fi
          echo "version=${cargo_version} publish=${publish}"
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG has a section for this version
        run: ./scripts/changelog-section.sh "${{ steps.v.outputs.version }}"

  linux:
    name: linux (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    # Ubuntu 24.04 sets the glibc baseline (2.39) for the tarballs and AppImages.
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/ci-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          cache-on-failure: true
      - run: cargo build --release --locked -p kaseer
      - name: Smoke test
        run: |
          out="$(target/release/kaseer --version)"; echo "$out"
          [ "$out" = "kaseer ${VERSION}" ] || { echo "::error::--version does not report ${VERSION}"; exit 1; }
      - run: ./scripts/package-linux.sh target/release/kaseer "$VERSION" dist
      # The raw binary: kaseer-cloud serves it to enrolled terminals as their update.
      - run: cp target/release/kaseer "dist/kaseer-${VERSION}-${{ matrix.arch }}-linux"
      - name: AppImage runs
        run: |
          out="$("dist/Kaseer-${VERSION}-${{ matrix.arch }}.AppImage" --appimage-extract-and-run --version)"
          [ "$out" = "kaseer ${VERSION}" ] || { echo "::error::the AppImage does not report ${VERSION}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos (universal, notarised)
    needs: check
    runs-on: macos-15
    timeout-minutes: 120
    # Developer ID + App Store Connect secrets; only main and v* tags may use this environment.
    environment: release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal
          cache-on-failure: true
      - name: Build both slices
        run: |
          cargo build --release --locked -p kaseer --target aarch64-apple-darwin
          cargo build --release --locked -p kaseer --target x86_64-apple-darwin
          mkdir -p build
          lipo -create -output build/kaseer \
            target/aarch64-apple-darwin/release/kaseer target/x86_64-apple-darwin/release/kaseer
          lipo -archs build/kaseer
      - name: Smoke test
        run: |
          out="$(build/kaseer --version)"; echo "$out"
          [ "$out" = "kaseer ${VERSION}" ] || { echo "::error::--version does not report ${VERSION}"; exit 1; }
      - name: Signing keychain and notary key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: ./scripts/ci-keychain.sh setup
      - name: Kaseer.app and DMG (Developer ID, notarised)
        env:
          MACOS_NOTARIZE: "1"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ./scripts/package-macos.sh build/kaseer "$VERSION" dist
      - name: Remove keychain and notary key
        if: always()
        run: ./scripts/ci-keychain.sh cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: windows (x64)
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          cache-on-failure: true
      - run: cargo build --release --locked -p kaseer
      - run: ./scripts/package-windows.sh target/release/kaseer.exe "$VERSION" x64 dist
      # The raw binary: kaseer-cloud serves it to enrolled terminals as their update.
      - run: cp target/release/kaseer.exe "dist/kaseer-${VERSION}-x86_64-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [check, linux, macos, windows]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      # Unversioned copies: https://github.com/<repo>/releases/latest/download/<name> always
      # serves the newest build, so kaseer.site's Download buttons never go stale.
      - name: Stable names and checksums
        run: |
          set -euo pipefail
          cd dist
          cp "Kaseer-${VERSION}.dmg" Kaseer.dmg
          cp "Kaseer-Setup-${VERSION}-x64.exe" Kaseer-Setup-x64.exe
          cp "Kaseer-${VERSION}-x64.zip" Kaseer-x64.zip
          for arch in x86_64 aarch64; do cp "Kaseer-${VERSION}-${arch}.AppImage" "Kaseer-${arch}.AppImage"; done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          ./scripts/changelog-section.sh "$VERSION" > notes.md
          cat >> notes.md <<EOF

          ## Download

          - Windows 10 and 11: [Kaseer-Setup-${VERSION}-x64.exe](${base}/Kaseer-Setup-${VERSION}-x64.exe) (no administrator rights needed) or the portable [zip](${base}/Kaseer-${VERSION}-x64.zip). If SmartScreen stops it, choose **More info**, then **Run anyway**.
          - macOS 11+ (Apple Silicon and Intel): [Kaseer-${VERSION}.dmg](${base}/Kaseer-${VERSION}.dmg). Open it and drag Kaseer to Applications.
          - Linux: [x86_64 AppImage](${base}/Kaseer-${VERSION}-x86_64.AppImage) or [aarch64 AppImage](${base}/Kaseer-${VERSION}-aarch64.AppImage). Run \`chmod +x Kaseer-*.AppImage\`, then start it. Needs glibc 2.39+ (Ubuntu 24.04, Debian 13, Fedora 40 or later).

          Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`.
          EOF
          gh release create "$tag" dist/* --verify-tag --latest \
            --title "Kaseer ${VERSION}" --notes-file notes.md
